[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "replay-likelihood-correction"
version = "0.2.0"
description = "Replay Likelihood Correction for Class-Incremental Learning"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "torch>=2.2", "torchvision>=0.17", "scipy>=1.10", "Pillow>=10"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
rlc-experiment = "rlc.experiment:main"

[tool.setuptools.packages.find]
include = ["rlc*", "wnet*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
